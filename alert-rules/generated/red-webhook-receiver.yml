# Generated by platform/generate.py from services/webhook-receiver.yaml. Do not edit by hand.
groups:
  - name: red-webhook-receiver
    rules:
      - alert: WebhookReceiverDown
        expr: up{job="webhook-receiver"} == 0
        for: 2m
        labels:
          severity: critical
          service: webhook-receiver
          runbook: runbooks/generated/webhook-receiver.md
        annotations:
          summary: "webhook-receiver is not being scraped"
          description: "Prometheus has failed to scrape webhook-receiver for 2 minutes."

      - alert: WebhookReceiverHighErrorRate
        expr: |
          (
            sum(rate(webhook_received_total{service="webhook-receiver",status=~"5.."}[5m]))
            /
            sum(rate(webhook_received_total{service="webhook-receiver"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: webhook-receiver
          runbook: runbooks/generated/webhook-receiver.md
        annotations:
          summary: "High 5xx error rate on webhook-receiver"
          description: "More than 5% of webhook-receiver requests returned 5xx over 5 minutes."

      - alert: WebhookReceiverHighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, route) (
              rate(webhook_received_duration_seconds_bucket{service="webhook-receiver"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: webhook-receiver
          runbook: runbooks/generated/webhook-receiver.md
        annotations:
          summary: "p99 latency above 0.5 s on webhook-receiver"
          description: "p99 route latency on webhook-receiver exceeded 0.5 s for 5 minutes."
