# Generated by platform/generate.py from services/foreign-app.yaml. Do not edit by hand.
groups:
  - name: red-foreign-app
    rules:
      - alert: ForeignAppDown
        expr: up{job="foreign-app"} == 0
        for: 2m
        labels:
          severity: critical
          service: foreign-app
          runbook: runbooks/generated/foreign-app.md
        annotations:
          summary: "foreign-app is not being scraped"
          description: "Prometheus has failed to scrape foreign-app for 2 minutes."

      - alert: ForeignAppHighErrorRate
        expr: |
          (
            sum(rate(orders_http_requests_total{service="foreign-app",status=~"5.."}[5m]))
            /
            sum(rate(orders_http_requests_total{service="foreign-app"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: foreign-app
          runbook: runbooks/generated/foreign-app.md
        annotations:
          summary: "High 5xx error rate on foreign-app"
          description: "More than 5% of foreign-app requests returned 5xx over 5 minutes."

      - alert: ForeignAppHighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, route) (
              rate(orders_http_request_duration_seconds_bucket{service="foreign-app"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: foreign-app
          runbook: runbooks/generated/foreign-app.md
        annotations:
          summary: "p99 latency above 0.5 s on foreign-app"
          description: "p99 route latency on foreign-app exceeded 0.5 s for 5 minutes."
