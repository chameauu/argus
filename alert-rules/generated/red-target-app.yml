# Generated by platform/generate.py from services/target-app.yaml. Do not edit by hand.
groups:
  - name: red-target-app
    rules:
      - alert: TargetAppDown
        expr: up{job="target-app"} == 0
        for: 2m
        labels:
          severity: critical
          service: target-app
          runbook: runbooks/generated/target-app.md
        annotations:
          summary: "target-app is not being scraped"
          description: "Prometheus has failed to scrape target-app for 2 minutes."

      - alert: TargetAppHighErrorRate
        expr: |
          (
            sum(rate(target_app_http_requests_total{service="target-app",status=~"5.."}[5m]))
            /
            sum(rate(target_app_http_requests_total{service="target-app"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: target-app
          runbook: runbooks/generated/target-app.md
        annotations:
          summary: "High 5xx error rate on target-app"
          description: "More than 5% of target-app requests returned 5xx over 5 minutes."

      - alert: TargetAppHighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, endpoint) (
              rate(target_app_http_request_duration_seconds_bucket{service="target-app"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: target-app
          runbook: runbooks/generated/target-app.md
        annotations:
          summary: "p99 latency above 0.5 s on target-app"
          description: "p99 endpoint latency on target-app exceeded 0.5 s for 5 minutes."
