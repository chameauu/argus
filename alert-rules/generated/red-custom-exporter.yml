# Generated by platform/generate.py from services/custom-exporter.yaml. Do not edit by hand.
groups:
  - name: red-custom-exporter
    rules:
      - alert: CustomExporterDown
        expr: up{job="custom-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          service: custom-exporter
          runbook: runbooks/generated/custom-exporter.md
        annotations:
          summary: "custom-exporter is not being scraped"
          description: "Prometheus has failed to scrape custom-exporter for 2 minutes."

      - alert: CustomExporterHighErrorRate
        expr: |
          (
            sum(rate(custom_exporter_http_requests_total{service="custom-exporter",status=~"5.."}[5m]))
            /
            sum(rate(custom_exporter_http_requests_total{service="custom-exporter"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: custom-exporter
          runbook: runbooks/generated/custom-exporter.md
        annotations:
          summary: "High 5xx error rate on custom-exporter"
          description: "More than 5% of custom-exporter requests returned 5xx over 5 minutes."

      - alert: CustomExporterHighLatency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, route) (
              rate(custom_exporter_http_request_duration_seconds_bucket{service="custom-exporter"}[5m])
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          service: custom-exporter
          runbook: runbooks/generated/custom-exporter.md
        annotations:
          summary: "p99 latency above 0.5 s on custom-exporter"
          description: "p99 route latency on custom-exporter exceeded 0.5 s for 5 minutes."
