# Hand-written platform self-monitoring rules.
#
# These alert on the observability stack itself (Prometheus scrape health, TSDB
# size, rule evaluation) rather than on a service. They are deliberately NOT
# generated from services/*.yaml: they describe the platform, not an application
# contract, and must survive every descriptor being added or deleted.
#
# Loaded by the existing /etc/prometheus-rules/*.yml glob alongside rules.yml.
#
# Every expression below was checked against this Prometheus before shipping.
# Alertmanager is an infrastructure scrape target (alertmanager:9093,
# job="alertmanager"), and that is why PlatformAlertDeliveryFailing exists here:
# Watchdog proves only that Prometheus evaluates rules, not that a notification
# left the box, so without the alertmanager_* series a permanently failing
# integration looked identical to a healthy one.
groups:
  - name: platform
    rules:
      # Any scrape target that has been unreachable for a full 5m. The app-level
      # <Service>Down alerts are generated per descriptor; this one also covers
      # the infrastructure targets.
      - alert: PlatformTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "up == 0 for {{ $labels.job }} ({{ $labels.instance }}) for 5 minutes; the target is not being scraped."

      # Volume collapse, not value collapse: a target that starts returning far
      # fewer samples than its own recent maximum is usually broken, not quiet.
      # 80% of the 1h max leaves room for ordinary churn.
      - alert: PlatformScrapeSamplesDrop
        expr: scrape_samples_scraped < 0.8 * max_over_time(scrape_samples_scraped[1h])
        for: 10m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: "Scrape volume dropped for {{ $labels.job }}"
          description: "{{ $labels.job }} ({{ $labels.instance }}) is exposing under 80% of its 1h-high sample count (current: {{ $value }}) for 10 minutes."

      # Container memory was invisible: tempo sat at 99.3% of a 512 MiB limit
      # and restarted 19 times with no page, because node-exporter reports the
      # host, not a container's cgroup. cAdvisor labels each container `name`
      # (the `container` label only appears in kubelet's cAdvisor), so the join
      # is on name. The second term is the divide-by-zero guard: an unlimited
      # container has limit 0, so the ratio is +Inf and would otherwise satisfy
      # > 0.85 forever; requiring a finite limit drops it.
      - alert: ContainerMemoryHigh
        expr: |
          (container_memory_working_set_bytes{job="cadvisor", name!=""}
            / container_spec_memory_limit_bytes{job="cadvisor", name!=""} > 0.85)
          and on (name) container_spec_memory_limit_bytes{job="cadvisor", name!=""} > 0
        for: 10m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: "Container {{ $labels.name }} is above 85% of its memory limit"
          description: "{{ $labels.name }} ({{ $labels.image }}) sits at {{ $value | humanizePercentage }} of its finite memory limit for 10 minutes. A restart or OOM kill follows; raise the limit or fix the leak before it does."

      # Head series measured 2026-11-23 at 7471-7551, stable for 10+ minutes,
      # after cAdvisor, Alertmanager and the dimension-label allowlist were in
      # place. The previous baseline was 3018; adding cAdvisor (memory-only
      # ~490), Alertmanager (~440) and the allowlist's dimension labels (~24
      # series) accounts for ~950. The rest is churn: head retains ~3k stale
      # series from container/veth/overlay recreation until compaction, while
      # live series are ~4480, which is why the threshold tracks head.
      # 11000 is ~46% above the measured head and ~2.5x live series: enough
      # headroom for onboarding and routine churn (a `compose up -d` moved the
      # head by hundreds during this work), low enough to catch an unbounded
      # label before disk or the 1 GiB mem_limit becomes the symptom. Paired
      # with the labelkeep guard in the app jobs.
      - alert: PlatformTSDBHighSeries
        expr: prometheus_tsdb_head_series > 11000
        for: 10m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: "Prometheus head series above 11000"
          description: "prometheus_tsdb_head_series is {{ $value }} (threshold 11000, measured baseline 7471-7551); check recent descriptor onboarding and label cardinality."

      # Any rule evaluation failure means alerts and recording rules are silently
      # not being produced. rate() so a restart-reset counter cannot look like a
      # permanent alert, and > 0 rather than a threshold: one failure matters.
      - alert: PlatformRuleEvaluationFailing
        expr: rate(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          component: platform
        annotations:
          summary: "Rule evaluation failing for {{ $labels.rule_group }}"
          description: "{{ $labels.rule_group }} has failed evaluation in the last 5 minutes ({{ $value | printf \"%.4f\" }} failures/s). Alerts from that group are stale."

      # Alertmanager is scraped (job="alertmanager"), so delivery failure has a
      # series to alert on. > 0 rather than a threshold: one failed notification
      # is one page nobody received. for: 10m keeps a single transient retry
      # from paging, while a broken integration (bad webhook, rejected config)
      # fails continuously and is caught.
      - alert: PlatformAlertDeliveryFailing
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 10m
        labels:
          severity: warning
          component: platform
        annotations:
          summary: "Alertmanager is failing to deliver notifications ({{ $labels.integration }})"
          description: "{{ $labels.integration }} has failed notifications with reason {{ $labels.reason }} ({{ $value | printf \"%.4f\" }} failures/s over 5m). Alerts are firing but not leaving the box."

      # Pushed OTLP applications have no `up` series: the collector's remote
      # write creates their series, so no scrape target exists to go down and
      # PlatformTargetDown can never see them detach. `up` is really a
      # freshness signal, and this is its replacement on the app side: any
      # service that reported HTTP counters within the last hour but has gone
      # quiet for 15 minutes is either detached or wedged. It deliberately runs
      # on the metric name rather than on the scrape job, so scraper and pusher
      # are covered by the same rule — for a scraped service that keeps
      # answering, `up` stays 1 while this measures the traffic itself.
      # The obvious spelling, timestamp(last_over_time(...)), does NOT work:
      # timestamp() of a function result returns the *evaluation* time, not the
      # sample's time (measured on 2.53: it read 2700s at eval_time 45m for a
      # series whose newest sample was at 1140s). timestamp() only preserves
      # the real sample time when its argument is a bare vector selector, so
      # the selector is timestamped inside a subquery and last_over_time picks
      # the newest of those timestamps. That is the wall-clock time of the last
      # reported sample, which is what makes a *pushed* series (no scrape
      # timestamp of its own) evaluable; max by (service_name) then collapses
      # the status/route/method dimensions down to one series per service. The
      # subquery step only bounds scan cost (60 points, not 240 at the 15s eval
      # interval); the inner selector's 5m lookback means the first step after a
      # sample still stamps it exactly, so the age is not rounded by the step.
      # A pushed app that stops pushing but is still scraped
      # stays visible here, and a scraped app whose counters freeze is caught
      # even though its scrapes succeed.
      #
      # Grouped by `service`, which both paths carry: Prometheus stamps it on
      # scraped series via metric_relabel_configs, and the collector copies it
      # from the OTLP resource attribute for pushed series. A scraped app that
      # dies is also caught by PlatformTargetDown, but grouping here means the
      # same rule covers a pushed app that has no `up` series at all.
      - alert: ServiceTelemetryStale
        expr: time() - max by (service) (last_over_time(timestamp({__name__=~".+_http_requests_total"})[1h:1m])) > 900
        labels:
          severity: warning
          component: platform
          service: "{{ $labels.service }}"
        annotations:
          summary: "No HTTP telemetry from {{ $labels.service }} for 15 minutes"
          description: "{{ $labels.service }} last reported an *_http_requests_total sample {{ $value | printf \"%.0f\" }}s ago (> 15m). No traffic is reaching the pipeline: the exporter detached, the collector is dropping it, or the app is wedged. Covers scraped and pushed services alike."

      # Dead-man's switch. vector(1) is always true, so this alert is expected to
      # be firing permanently; it proves the Prometheus -> Alertmanager -> receiver
      # chain is alive. Silence it at the Alertmanager, never by deleting it.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          component: platform
        annotations:
          summary: "Watchdog: alerting pipeline is alive"
          description: "Always firing by design. If this alert disappears, alert delivery is broken."
