[project]
name = "argus"
version = "0.1.0"
description = "Step-by-step observability platform rebuild"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "prometheus-client==0.20.0",
    "uvicorn==0.30.6",
]

[dependency-groups]
dev = ["pre-commit>=3.8.0", "ruff>=0.6.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
