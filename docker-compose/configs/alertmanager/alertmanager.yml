global:
  resolve_timeout: 5m

route:
  receiver: default-warning
  group_by: ["alertname", "component"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-immediate
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    - matchers:
        - severity="warning"
      receiver: default-warning
      continue: false

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["component", "instance"]

receivers:
  - name: default-warning
    webhook_configs:
      - url: "http://webhook-receiver:8080/warning"
        send_resolved: true

  - name: critical-immediate
    webhook_configs:
      - url: "http://webhook-receiver:8080/critical"
        send_resolved: true
