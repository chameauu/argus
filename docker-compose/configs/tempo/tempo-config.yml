# Tempo monolithic configuration (single binary, -target=all).
# Local filesystem backend — appropriate for this single-node local stack.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Retention: keep trace blocks for 7 days, matching Prometheus (7d) and Loki (168h).
# Without this, Tempo defaults to 336h (14d) and grows unbounded on a local disk.
compactor:
  compaction:
    block_retention: 168h
    compacted_block_retention: 1h
    compaction_window: 1h

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

usage_report:
  reporting_enabled: false
