# Promtail configuration — Stage 2 (logs pipeline)
# Discovers every Docker container via the Docker socket and ships stdout/stderr
# to Loki, attaching compose_service / compose_project labels for querying.
# Reference: https://grafana.com/docs/loki/latest/send-data/promtail/configuration/
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only ingest containers belonging to THIS compose project. Without this,
      # Promtail picks up every container on the host (e.g. unrelated projects)
      # and floods Loki with "timestamp too old" rejections.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: "argus"
        action: keep
      # Container name arrives as "/<name>" — strip the leading slash.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # Docker Compose labels -> first-class queryable labels.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "compose_project"
      # stdout vs stderr.
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "logstream"
    pipeline_stages:
      - docker: {}
