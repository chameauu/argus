# Generated by platform/generate.py from services/*.yaml. Do not edit by hand.
# Regenerate: python3 platform/generate.py

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus-rules/*.yml
  - /etc/prometheus-rules/generated/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
    metric_relabel_configs:
      - target_label: service
        replacement: prometheus

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    metric_relabel_configs:
      - target_label: service
        replacement: node-exporter

  # The log agent monitors itself. Without this job the mitigation recorded in
  # docs/platform/adr-0001-log-agent.md (loki_process_dropped_lines_total) is
  # unobservable from the platform.
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]
    metric_relabel_configs:
      - target_label: service
        replacement: alloy

  - job_name: "custom-exporter"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["custom-exporter:9200"]
    metric_relabel_configs:
      # Cardinality guard. Only labels the platform knows about survive the
      # scrape; everything else is dropped before it reaches the TSDB. One app
      # that puts an order id or a user id in a label multiplies series without
      # bound and ends the stack; this allowlist costs one regex per scrape and
      # is cheaper than the outage. __name__, job and instance are injected by
      # Prometheus and must be kept, as must le/quantile for histograms and
      # summaries. Infrastructure jobs (prometheus, node-exporter, alloy) do not
      # get this guard: their label sets are large and legitimately varied.
      - action: labelkeep
        regex: "__name__|service|route|endpoint|status|le|quantile|job|instance|version"
      - target_label: service
        replacement: custom-exporter

  - job_name: "foreign-app"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["foreign-app:8099"]
    metric_relabel_configs:
      # Cardinality guard. Only labels the platform knows about survive the
      # scrape; everything else is dropped before it reaches the TSDB. One app
      # that puts an order id or a user id in a label multiplies series without
      # bound and ends the stack; this allowlist costs one regex per scrape and
      # is cheaper than the outage. __name__, job and instance are injected by
      # Prometheus and must be kept, as must le/quantile for histograms and
      # summaries. Infrastructure jobs (prometheus, node-exporter, alloy) do not
      # get this guard: their label sets are large and legitimately varied.
      - action: labelkeep
        regex: "__name__|service|route|endpoint|status|le|quantile|job|instance|version"
      - target_label: service
        replacement: foreign-app

  - job_name: "target-app"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["target-app:8000"]
    metric_relabel_configs:
      # Cardinality guard. Only labels the platform knows about survive the
      # scrape; everything else is dropped before it reaches the TSDB. One app
      # that puts an order id or a user id in a label multiplies series without
      # bound and ends the stack; this allowlist costs one regex per scrape and
      # is cheaper than the outage. __name__, job and instance are injected by
      # Prometheus and must be kept, as must le/quantile for histograms and
      # summaries. Infrastructure jobs (prometheus, node-exporter, alloy) do not
      # get this guard: their label sets are large and legitimately varied.
      - action: labelkeep
        regex: "__name__|service|route|endpoint|status|le|quantile|job|instance|version"
      - target_label: service
        replacement: target-app

  - job_name: "webhook-receiver"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["webhook-receiver:8080"]
    metric_relabel_configs:
      # Cardinality guard. Only labels the platform knows about survive the
      # scrape; everything else is dropped before it reaches the TSDB. One app
      # that puts an order id or a user id in a label multiplies series without
      # bound and ends the stack; this allowlist costs one regex per scrape and
      # is cheaper than the outage. __name__, job and instance are injected by
      # Prometheus and must be kept, as must le/quantile for histograms and
      # summaries. Infrastructure jobs (prometheus, node-exporter, alloy) do not
      # get this guard: their label sets are large and legitimately varied.
      - action: labelkeep
        regex: "__name__|service|route|endpoint|status|le|quantile|job|instance|version"
      - target_label: service
        replacement: webhook-receiver
