# Generated by platform/generate.py from services/*.yaml. Do not edit by hand.
# Regenerate: python3 platform/generate.py

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus-rules/*.yml
  - /etc/prometheus-rules/generated/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
    metric_relabel_configs:
      - target_label: service
        replacement: prometheus

  # Alertmanager must be a scrape target for PlatformAlertDeliveryFailing to
  # prove delivery, not just evaluation: without it the Watchdog proves only
  # that Prometheus evaluates rules, not that notifications leave the box.
  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
    metric_relabel_configs:
      - target_label: service
        replacement: alertmanager

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    metric_relabel_configs:
      - target_label: service
        replacement: node-exporter

  # Per-container memory. node-exporter reports the host only, so a container
  # pinned at its mem_limit (tempo: 19 restarts) is invisible without this.
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - target_label: service
        replacement: cadvisor

  # The log agent monitors itself. Without this job the mitigation recorded in
  # docs/platform/adr-0001-log-agent.md (loki_process_dropped_lines_total) is
  # unobservable from the platform.
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]
    metric_relabel_configs:
      - target_label: service
        replacement: alloy

  - job_name: "custom-exporter"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["custom-exporter:9200"]
    metric_relabel_configs:
      # Cardinality guard. Only labels the platform knows about survive the
      # scrape; everything else is dropped before it reaches the TSDB. One app
      # that puts an order id or a user id in a label multiplies series without
      # bound and ends the stack; this allowlist costs one regex per scrape and
      # is cheaper than the outage. A missing dimension label does not reduce
      # cardinality: it silently merges distinct series onto one label set, and
      # Prometheus keeps only one sample per timestamp (python_gc_* loses
      # generation this way). `type`, `mode`, `code`, `method`, `handler` and
      # `generation` are therefore kept, not dropped. __name__, job and instance
      # are injected by Prometheus and must be kept, as must le/quantile for
      # histograms and summaries. Infrastructure jobs (prometheus, alertmanager,
      # node-exporter, cadvisor, alloy) do not get this guard: their label sets
      # are large and legitimately varied.
      - action: labelkeep
        regex: "__name__|service|route|endpoint|status|le|quantile|job|instance|version|generation|type|mode|code|method|handler"
      - target_label: service
        replacement: custom-exporter

  - job_name: "foreign-app"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["foreign-app:8099"]
    metric_relabel_configs:
      # Cardinality guard. Only labels the platform knows about survive the
      # scrape; everything else is dropped before it reaches the TSDB. One app
