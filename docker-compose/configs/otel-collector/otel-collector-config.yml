# OpenTelemetry Collector — the single OTLP ingress for this stack.
#
# Any app that follows the contract only needs OTEL_EXPORTER_OTLP_ENDPOINT to
# reach this process; the pipelines below fan its three signals out to Tempo,
# Prometheus and Loki. Nothing here is per-service.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# Span-derived RED metrics. A connector is both an exporter of spans and a
# receiver of metrics: it consumes the spans already flowing to Tempo and
# synthesises request rate, error ratio and latency series from them. That is
# what lets an application with no metric-naming convention (no
# `*_http_requests_total` counter) still get RED panels: the only thing it
# must do is emit traces with a service.name, which the contract requires.
#
# `namespace` prefixes every generated metric (`spanmetrics_calls_total`,
# `spanmetrics_duration_milliseconds_bucket`) so they cannot collide with an
# app's own counters. `dimensions` are span attributes copied onto the
# generated series; the connector always adds `service.name` (resource),
# `span.name`, `span.kind` and `status.code`. The remote-write exporter
# sanitises dots to underscores, so these land as http_request_method,
# http_route, status_code.
#
# `status.code` is NOT listed below: v0.109.0 adds it unconditionally and
# rejects it as a duplicate dimension. It is still present as `status_code` on
# every generated series, which is what the error-ratio panel filters on.
#
# Our apps currently instrument with semconv 1.27-era libraries and emit
# `http.method`, not `http.request.method`; that dimension is therefore empty
# for them and populated only by modern-semconv apps. `http.route` is present
# on both FastAPI and Flask spans and is the useful grouping label.
connectors:
  spanmetrics:
    namespace: spanmetrics
    # Cumulative connector state: without an expiry a service keeps appearing in
    # `$service` after its container is gone (demo-attach survived its own removal).
    metrics_expiration: 5m
    metrics_flush_interval: 15s
    dimensions:
      - name: http.request.method
      - name: http.route
      # Portability for apps whose SDK leaves span status UNSET on a 5xx response.
      # Our Python instrumentation does set STATUS_CODE_ERROR on 5xx (measured:
      # injecting errors moves the ratio), but that is an SDK behaviour, not a
      # guarantee, so the HTTP status is carried as a dimension as well.
      - name: http.status_code

processors:
  # Bounded memory: the collector must shed load rather than be OOM-killed by
  # a burst from one misbehaving application.
  memory_limiter:
    check_interval: 2s
    limit_mib: 400

  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
      # One identity label on both ingestion paths. Prometheus stamps `service`
      # on every scraped app series; a pushed OTLP app gets the same label here
      # from its resource attribute, so one dashboard, one SLO and one staleness
      # rule can see scraped and pushed services alike. (The remote-write
      # exporter also derives `service_name` and `job` on its own — do not copy
      # those by hand; a duplicate attribute is joined with ";" and renders as
      # service_name="probe-x;probe-x".)
      - key: service
        from_attribute: service.name
        action: insert

  # An OTLP app that omits service.name lands as an unattributable resource:
  # every series it pushes is anonymous, and no per-service rule, SLO or
  # dashboard can see it. Drop those datapoints at ingress instead of storing
  # them, so a non-conforming app fails visibly (nothing appears) rather than
  # silently polluting the store. This is a deliberate contract violation, not
  # a partial success: the receiver still answers 200/partialSuccess, and the
  # drop is silent in the collector log by design, which is why
  # platform/contract_live.py probes for it instead of trusting the response.
  #
  # `filter` is applied after `resource` so it inspects the original
  # service.name (the resource processor only inserts a copy and never removes
  # it). error_mode: ignore keeps one malformed attribute from taking the
  # pipeline down; the expression is a nil-or-empty test on the resource
  # attribute in the metric/datapoint, span and log_record contexts.
  filter/drop-unattributed:
    error_mode: ignore
    metrics:
      datapoint:
        - 'resource.attributes["service.name"] == nil or resource.attributes["service.name"] == ""'
    traces:
      span:
        - 'resource.attributes["service.name"] == nil or resource.attributes["service.name"] == ""'
    logs:
      log_record:
        - 'resource.attributes["service.name"] == nil or resource.attributes["service.name"] == ""'

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics land in the same Prometheus the platform scrapes. The receiver is
  # enabled by --web.enable-remote-write-receiver in compose. Without
  # resource_to_telemetry_conversion the resource attributes never become
  # series labels, and every pushed metric would collapse into one series.
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true

  # Loki 3.x native OTLP endpoint. Alloy already ships container *stdout* to
  # Loki; this path carries logs pushed over OTLP, so an app that does both
  # will appear twice. Prefer one mechanism per application.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

# The collector image is distroless (no shell, no curl/wget), so a Docker
# HEALTHCHECK cannot exec inside it. This extension exposes a plain HTTP
# liveness/readiness endpoint that external probes (and the Stage 6 script)
# can query instead.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/drop-unattributed, batch]
      # `spanmetrics` is a connector: traces leave here without reaching Tempo
      # twice, and the connector's output re-enters the metrics pipeline below.
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      # spanmetrics is the receiver half of the connector, not a socket.
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource, filter/drop-unattributed, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, filter/drop-unattributed, batch]
      exporters: [otlphttp/loki]
