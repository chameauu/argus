name: argus

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retention sizing measured 2026-11-23 with the full demo stack up:
      #   head series 3018; ingestion 199.8 samples/s (60s counter delta);
      #   compressed chunk 1.32 B/sample (compaction_chunk_size_bytes_sum /
      #   compaction_chunk_samples_sum) -> 199.8 * 86400 * 1.32 = 22.8 MB/day.
      #   30d = 684 MB of chunks; padded to 2 B/sample incl. index/WAL = 1.04 GB.
      #   App jobs alone scrape 13.6 samples/s -> 1.55 MB/day, 47 MB per 30d.
      # Disk: ~71 GB free on the host filesystem backing the prometheus-data
      #   volume, so 30d fits with large margin. Keep 30d and cap at 2 GB:
      #   ~2x the padded 30d projection, ~3% of free disk, and it bounds an
      #   unexpected cardinality spike before the 1 GiB mem_limit is the
      #   symptom (the labelkeep guard in the app jobs is the first line).
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./configs/prometheus:/etc/prometheus:ro
      - ../alert-rules:/etc/prometheus-rules:ro
      - prometheus-data:/prometheus
    ports:
        - "19090:9090"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g      # 1 GiB, was 512 MiB. A cardinality spike must not OOM the
                       # process before PlatformTSDBHighSeries has held for its 10m
                       # `for:`, or the alert reports the aftermath of a crash
                       # instead of the cause. Measured use is ~77 MiB at 6.7k head
                       # series, so 1g is headroom against a spike, not a working
                       # set. Retention stays bounded to 2 GB on disk.

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./configs/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
        - "19093:9093"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
        - "19100:9100"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

  cadvisor:
    # Container memory is invisible to node-exporter: it reports the host, not
    # per-container cgroups. Without this target the stack could sit at 99% of
    # a container's mem_limit and restart (tempo: 19 restarts) with no alert.
    # v0.55.1, not the 0.49 line: this host runs Docker 29.8.2 with the containerd
    # image store, where the old Docker factory looks for
    # image/overlayfs/layerdb/mounts/<id>/mount-id (absent) and drops every
    # container ("failed to identify the read-write layer ID"). Fixed upstream;
    # 0.55.1 here reports every container with name/image labels.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    command:
      # --docker_only skips the host's system cgroups, cAdvisor's expensive half.
      # --housekeeping_interval=30s bounds the reading's staleness: Prometheus
      # scrapes every 15s, so a 30s interval yields at most two scrapes per
      # update and at most 30s of lag between a memory spike and the series.
      # That is far finer than the 10m `for:` needs at negligible CPU cost;
      # cAdvisor's 60s default would also work, 30s just halves the lag.
      # --store_container_labels=false drops the 28 container_label_* labels per
      # series: only name and image are kept, matching the labelkeep ethos.
      # --enable_metrics=memory keeps the exporter to what the platform consumes
      # (ContainerMemoryHigh). The full set added 2220 series; disk/diskIO and
      # network duplicate node-exporter's host view and accounted for most of
      # it, and a memory-only cAdvisor adds ~490.
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --enable_metrics=memory
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
        - "18080:8080"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m

  custom-exporter:
    build:
      context: ../custom-exporter
    restart: unless-stopped
    ports:
        - "19200:9200"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 192m

  target-app:
    build:
      context: ../target-app
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=target-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    ports:
        - "18000:8000"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    depends_on:
      custom-exporter:
        condition: service_healthy
      otel-collector:
        condition: service_started

  foreign-app:
    build:
      context: ../foreign-app
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=foreign-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    ports:
        - "18099:8099"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    depends_on:
      custom-exporter:
        condition: service_healthy
      otel-collector:
        condition: service_started

  load-generator:
    image: curlimages/curl:8.8.0
    restart: unless-stopped
    networks:
      - obs-net
    depends_on:
      target-app:
        condition: service_healthy
    mem_limit: 32m
    volumes:
      - ../load-generator:/scripts:ro
    entrypoint: ["sh", "/scripts/loop.sh"]

  webhook-receiver:
    build:
      context: ../webhook-receiver
    restart: unless-stopped
    ports:
        - "18090:8080"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 192m

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme_local_only
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
        - "13000:3000"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configs/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
        - "13100:3100"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./configs/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 192m
    depends_on:
      loki:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./configs/tempo:/etc/tempo:ro
      - tempo-data:/data/tempo
    ports:
        - "13200:3200"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g      # tempo idles near 500 MiB with the search cache warm; a 512 MiB
                       # limit had it at 99.3% and restarting (19 restarts), silently losing traces.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: --config=/etc/otelcol/otel-collector-config.yml
    volumes:
      - ./configs/otel-collector:/etc/otelcol:ro
    ports:
        - "13133:13133"
    networks:
      - obs-net
    mem_limit: 256m
    depends_on:
      tempo:
        condition: service_healthy

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
  tempo-data:

networks:
  obs-net:
    driver: bridge
