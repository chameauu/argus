name: argus

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./configs/prometheus:/etc/prometheus:ro
      - ../alert-rules:/etc/prometheus-rules:ro
      - prometheus-data:/prometheus
    ports:
        - "19090:9090"
    networks:
      - obs-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./configs/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
        - "19093:9093"
    networks:
      - obs-net

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
        - "19100:9100"
    networks:
      - obs-net

  custom-exporter:
    build:
      context: ../custom-exporter
    restart: unless-stopped
    ports:
        - "19200:9200"
    networks:
      - obs-net

  target-app:
    build:
      context: ../target-app
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=target-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    ports:
        - "18000:8000"
    networks:
      - obs-net
    depends_on:
      - custom-exporter
      - otel-collector

  load-generator:
    image: curlimages/curl:8.8.0
    restart: unless-stopped
    networks:
      - obs-net
    depends_on:
      - target-app
    entrypoint: >
      sh -c "while true; do
        curl -s -o /dev/null http://target-app:8000/work || true;
        curl -s -o /dev/null http://target-app:8000/error-prone || true;
        curl -s -o /dev/null http://target-app:8000/slow || true;
        sleep 2;
      done"

  webhook-receiver:
    build:
      context: ../webhook-receiver
    restart: unless-stopped
    ports:
        - "18090:8080"
    networks:
      - obs-net

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme_local_only
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
        - "13000:3000"
    networks:
      - obs-net
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configs/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
        - "13100:3100"
    networks:
      - obs-net

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./configs/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    networks:
      - obs-net
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./configs/tempo:/etc/tempo:ro
      - tempo-data:/data/tempo
    ports:
        - "13200:3200"
    networks:
      - obs-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: --config=/etc/otelcol/otel-collector-config.yml
    volumes:
      - ./configs/otel-collector:/etc/otelcol:ro
    networks:
      - obs-net
    depends_on:
      - tempo

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  promtail-positions:
  tempo-data:

networks:
  obs-net:
    driver: bridge
