name: argus

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./configs/prometheus:/etc/prometheus:ro
      - ../alert-rules:/etc/prometheus-rules:ro
      - prometheus-data:/prometheus
    ports:
        - "19090:9090"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./configs/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
        - "19093:9093"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
        - "19100:9100"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

  custom-exporter:
    build:
      context: ../custom-exporter
    restart: unless-stopped
    ports:
        - "19200:9200"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 192m

  target-app:
    build:
      context: ../target-app
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=target-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    ports:
        - "18000:8000"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    depends_on:
      custom-exporter:
        condition: service_healthy
      otel-collector:
        condition: service_started

  load-generator:
    image: curlimages/curl:8.8.0
    restart: unless-stopped
    networks:
      - obs-net
    depends_on:
      target-app:
        condition: service_healthy
    mem_limit: 32m
    entrypoint: >
      sh -c "while true; do
        curl -s -o /dev/null http://target-app:8000/work || true;
        curl -s -o /dev/null http://target-app:8000/error-prone || true;
        curl -s -o /dev/null http://target-app:8000/slow || true;
        sleep 2;
      done"

  webhook-receiver:
    build:
      context: ../webhook-receiver
    restart: unless-stopped
    ports:
        - "18090:8080"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 192m

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme_local_only
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
        - "13000:3000"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./configs/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
        - "13100:3100"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./configs/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 192m
    depends_on:
      loki:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    user: "0:0"
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./configs/tempo:/etc/tempo:ro
      - tempo-data:/data/tempo
    ports:
        - "13200:3200"
    networks:
      - obs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 512m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: --config=/etc/otelcol/otel-collector-config.yml
    volumes:
      - ./configs/otel-collector:/etc/otelcol:ro
    ports:
        - "13133:13133"
    networks:
      - obs-net
    mem_limit: 256m
    depends_on:
      tempo:
        condition: service_healthy

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  promtail-positions:
  tempo-data:

networks:
  obs-net:
    driver: bridge
