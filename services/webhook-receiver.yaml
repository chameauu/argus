name: webhook-receiver
owner: jmal
namespace: argus
environment: local

scrape:
  port: 8080
  path: /metrics
  interval: 15s

health:
  path: /healthz

slos:
  availability:
    objective: 0.995
    window: 30d
    # Invalid payloads are counted as status="rejected" (HTTP 400); 5xx remains
    # in the selector in case a future handler returns a server error.
    error_selector: 'status=~"rejected|5.."'
  latency:
    # Pending at drafting time; the app's /metrics now exposes this histogram.
    objective: 0.95
    threshold_seconds: 0.5
    histogram: webhook_received_duration_seconds

metrics:
  requests_total: webhook_received_total
  latency_histogram: webhook_received_duration_seconds
  route_label: route

routes_allowlist:
  - /critical
  - /warning
  - /received

runbook: runbooks/WebhookDeliveryFailing.md
