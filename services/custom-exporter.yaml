name: custom-exporter
owner: jmal
namespace: argus
environment: local

scrape:
  port: 9200
  path: /metrics
  interval: 15s

health:
  path: /healthz

slos:
  availability:
    objective: 0.995
    window: 30d
    error_selector: 'status=~"5.."'
  latency:
    objective: 0.95
    threshold_seconds: 0.5
    # Single source of truth for the latency histogram. The exporter observes
    # outbound deliveries under route="/webhook-delivery", so this SLO measures
    # delivery time instead of /metrics scrapes and /health probes.
    histogram: webhook_delivery_duration_seconds

metrics:
  requests_total: custom_exporter_http_requests_total
  route_label: route

# The latency SLI filters on this allowlist. Listing the delivery route makes
# the measurement explicit; an empty allowlist is rejected by validation.
routes_allowlist:
  - /webhook-delivery

runbook: runbooks/CustomExporterQueueHigh.md
