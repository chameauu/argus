name: target-app
owner: jmal
namespace: argus
environment: local

scrape:
  port: 8000
  path: /metrics
  interval: 15s

health:
  path: /healthz

slos:
  availability:
    objective: 0.995
    window: 30d
    error_selector: 'status=~"5.."'
  latency:
    objective: 0.95
    threshold_seconds: 0.5
    histogram: target_app_http_request_duration_seconds

metrics:
  requests_total: target_app_http_requests_total
  latency_histogram: target_app_http_request_duration_seconds
  route_label: endpoint

routes_allowlist:
  - /work
  - /slow
  - /error-prone

runbook: runbooks/TargetAppDown.md
