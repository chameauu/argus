name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff@0.6.9 check .
      - name: Ruff format check
        run: uvx ruff@0.6.9 format --check .

  validate-configs:
    name: Validate service configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus config (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/docker-compose/configs/prometheus:/cfg" \
            prom/prometheus:v2.53.0 check config /cfg/prometheus.yml

      - name: Validate Prometheus alert rules (if present)
        run: |
          shopt -s nullglob
          files=(alert-rules/*.yml alert-rules/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no alert rules yet"; exit 0
          fi
          targets=()
          for f in "${files[@]}"; do
            targets+=("/rules/$(basename "$f")")
          done
          docker run --rm --entrypoint promtool \
            -v "$PWD/alert-rules:/rules" \
            prom/prometheus:v2.53.0 check rules "${targets[@]}"

      - name: Validate Alertmanager config (if present)
        run: |
          if [ -f docker-compose/configs/alertmanager/alertmanager.yml ]; then
            docker run --rm --entrypoint amtool \
              -v "$PWD/docker-compose/configs/alertmanager:/cfg" \
              prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml
          else
            echo "no alertmanager config yet"
          fi

      - name: Validate Loki config
        run: |
          docker run --rm -v "$PWD/docker-compose/configs/loki:/etc/loki" \
            grafana/loki:3.4.2 -config.file=/etc/loki/loki-config.yml -verify-config

      - name: Validate Tempo config (if present)
        run: |
          if [ -f docker-compose/configs/tempo/tempo-config.yml ]; then
            docker run --rm -v "$PWD/docker-compose/configs/tempo:/etc/tempo" \
              grafana/tempo:2.6.1 -config.file=/etc/tempo/tempo-config.yml -config.verify=true
            echo "tempo config OK"
          else
            echo "no tempo config yet"
          fi

      - name: Validate Alloy config (if present)
        run: |
          if [ -f docker-compose/configs/alloy/config.alloy ]; then
            docker run --rm -v "$PWD/docker-compose/configs/alloy:/etc/alloy:ro" \
              grafana/alloy:v1.22.0 validate /etc/alloy/config.alloy
            echo "alloy config OK"
          else
            echo "no alloy config yet"
          fi

      - name: Validate dashboard JSON (if present)
        run: |
          shopt -s nullglob
          files=(dashboards/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no dashboards yet"; exit 0
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            jq empty "$f"
          done

      - name: Validate compose file
        run: cd docker-compose && docker compose config -q

  platform-gates:
    name: Platform gates (generator, contract, rule tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Offline and needs no container runtime: parse and validate every
      # descriptor before anything starts. The same check runs in pre-commit.
      - name: Descriptor lint (offline)
        run: python3 platform/contract_lint.py

      # Note: --check shells out to Docker for Sloth (the SLO rule renderer), so
      # this step needs a container runtime. GitHub-hosted runners provide one.
      - name: Generated artefacts match descriptors (no drift, no orphans)
        run: python3 platform/generate.py --check

      # Offline gate: promtool test rules over alert-rules/generated.
      - name: Prometheus rule unit tests
        run: bash platform/test_rules.sh

      - name: Start the demo stack for the live contract check
        run: docker compose -f docker-compose/docker-compose.yml up -d --build

      - name: Wait for the demo stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:19090/-/ready >/dev/null \
               && curl -fsS http://localhost:18000/healthz >/dev/null \
               && curl -fsS http://localhost:19200/healthz >/dev/null \
               && curl -fsS http://localhost:18090/healthz >/dev/null; then
              echo "stack ready after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "stack did not become ready" >&2
          docker compose -f docker-compose/docker-compose.yml ps >&2
          exit 1

      # Traces and logs need a few scrape intervals to appear in Tempo/Loki, so
      # retry before declaring the contract failed.
      - name: Contract v1 against every service descriptor
        run: |
          args=()
          for descriptor in services/*.yaml; do
            name="$(basename "$descriptor" .yaml)"
            port="$(python3 -c 'import sys; sys.path.insert(0, "platform"); from descriptor import parse_descriptor; print(parse_descriptor(open(sys.argv[1], encoding="utf-8").read())["scrape"]["port"])' "$descriptor")"
            host_port="$(docker compose -f docker-compose/docker-compose.yml \
              port "$name" "$port" 2>/dev/null | awk -F: 'END {print $NF}')" || true
            if [ -z "$host_port" ]; then
              echo "no published host port for $name (scrape.port $port); is it in compose?" >&2
              exit 1
            fi
            args+=("--service" "$name=http://localhost:$host_port")
          done
          printf 'contract targets:'; printf ' %s' "${args[@]}"; echo
          for i in $(seq 1 10); do
            if python3 platform/contract_live.py "${args[@]}" \
              --prometheus http://localhost:19090; then
              exit 0
            fi
            echo "contract attempt $i failed; retrying in 30s" >&2
            sleep 30
          done
          exit 1

      # A container reads its mounted config once, at start. Editing the file
      # without restarting leaves the stack serving the old config while the
      # repository claims otherwise -- which is how spanmetrics lived only in a
      # running container for an hour. This gate runs *after* the stack is up so
      # it compares the running containers against the committed files.
      - name: Running config matches the committed config
        run: python3 platform/config_parity.py

      - name: Stop the demo stack
        if: always()
        run: docker compose -f docker-compose/docker-compose.yml down -v
