# Pre-commit hooks — mirrors the CI checks in .github/workflows/ci.yml
# Install: uv run pre-commit install
# Run all:  uv run pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: promtool-check-config
        name: promtool check prometheus config
        entry: bash -c 'docker run --rm --entrypoint promtool -v "$PWD/docker-compose/configs/prometheus:/cfg" prom/prometheus:v2.53.0 check config /cfg/prometheus.yml'
        language: system
        pass_filenames: false
        files: ^docker-compose/configs/prometheus/.*\.ya?ml$

      - id: loki-verify-config
        name: loki verify-config
        entry: bash -c 'docker run --rm -v "$PWD/docker-compose/configs/loki:/etc/loki" grafana/loki:3.4.2 -config.file=/etc/loki/loki-config.yml -verify-config'
        language: system
        pass_filenames: false
        files: ^docker-compose/configs/loki/.*\.ya?ml$
