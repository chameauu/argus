# Pre-commit hooks — mirrors the CI checks in .github/workflows/ci.yml
# Install: uv run pre-commit install
# Run all:  uv run pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: promtool-check-config
        name: promtool check prometheus config
        entry: bash -c 'docker run --rm --entrypoint promtool -v "$PWD/docker-compose/configs/prometheus:/cfg" prom/prometheus:v2.53.0 check config /cfg/prometheus.yml'
        language: system
        pass_filenames: false
        files: ^docker-compose/configs/prometheus/.*\.ya?ml$

      # Mirrors the CI step: validate every hand-written rule file under
      # alert-rules/ (the generated/ subtree is covered by test_rules.sh and
      # Sloth). Globbing means a new hand-written rule file is picked up with no
      # edit here, exactly like platform.yml was.
      - id: promtool-check-rules
        name: promtool check alert rules
        entry: >-
          bash -c 'targets=(); for f in "$PWD"/alert-rules/*.yml; do
          targets+=("/rules/$(basename "$f")"); done;
          docker run --rm --entrypoint promtool -v "$PWD/alert-rules:/rules"
          prom/prometheus:v2.53.0 check rules "${targets[@]}"'
        language: system
        pass_filenames: false
        files: ^alert-rules/.*\.ya?ml$

      - id: amtool-check-config
        name: amtool check alertmanager config
        entry: bash -c 'docker run --rm --entrypoint amtool -v "$PWD/docker-compose/configs/alertmanager:/cfg" prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml'
        language: system
        pass_filenames: false
        files: ^docker-compose/configs/alertmanager/.*\.ya?ml$

      - id: loki-verify-config
        name: loki verify-config
        entry: bash -c 'docker run --rm -v "$PWD/docker-compose/configs/loki:/etc/loki" grafana/loki:3.4.2 -config.file=/etc/loki/loki-config.yml -verify-config'
        language: system
        pass_filenames: false
        files: ^docker-compose/configs/loki/.*\.ya?ml$

      - id: tempo-verify-config
        name: tempo verify-config
        entry: bash -c 'docker run --rm -v "$PWD/docker-compose/configs/tempo:/etc/tempo" grafana/tempo:2.6.1 -config.file=/etc/tempo/tempo-config.yml -config.verify=true'
        language: system
        pass_filenames: false
        files: ^docker-compose/configs/tempo/.*\.ya?ml$

      - id: alloy-validate-config
        name: alloy validate-config
        entry: bash -c 'docker run --rm -v "$PWD/docker-compose/configs/alloy:/etc/alloy:ro" grafana/alloy:v1.22.0 validate /etc/alloy/config.alloy'
        language: system
        pass_filenames: false
        files: ^docker-compose/configs/alloy/.*\.alloy$

      # Offline descriptor gate: no network, no Docker, no stack. This is what
      # an app team can run in its own CI, and it fails fast before the
      # Docker-backed generator and rule gates below.
      - id: platform-contract-lint
        name: descriptor lint (offline, no stack required)
        entry: python3 platform/contract_lint.py
        language: system
        pass_filenames: false
        files: ^(services/.*\.ya?ml|platform/(descriptor|contract_lint)\.py)$

      # The generator owns alert-rules/generated, dashboards/generated and
      # runbooks/generated, so drift includes orphaned artefacts from a deleted
      # descriptor. Note: --check shells out to Docker for Sloth and therefore
      # needs a container runtime.
      - id: platform-generate-check
        name: generate --check (no drift, no orphans; needs Docker for Sloth)
        entry: python3 platform/generate.py --check
        language: system
        pass_filenames: false
        files: ^(services/.*\.ya?ml|platform/.*|alert-rules/generated/.*|dashboards/generated/.*|runbooks/generated/.*)$

      # Offline gate; fails if a generated SLO expression no longer matches the
      # synthetic series in platform/tests. Needs Docker, not the running stack.
      - id: platform-rule-tests
        name: promtool test rules (generated SLO rules)
        entry: bash platform/test_rules.sh
        language: system
        pass_filenames: false
        files: ^(alert-rules/generated/.*|platform/tests/.*|platform/templates/.*)$

      # Live gate: needs the demo stack up (docker compose up -d --build).
      # The --service list is derived from services/*.yaml through the same
      # name -> scrape.port -> published host port lookup CI uses, so a new
      # descriptor needs no edit here.
      - id: platform-contract-demo
        name: contract v1 on every service descriptor (needs stack up)
        entry: bash platform/contract_live.sh
        language: system
        pass_filenames: false
        files: ^(services/.*\.ya?ml|platform/.*|docker-compose/configs/prometheus/.*)$
